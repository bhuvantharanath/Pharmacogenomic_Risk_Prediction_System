# Render Blueprint — the backend, reproducible from the repository.
#
# WHY A BLUEPRINT RATHER THAN DASHBOARD CLICKS
#   Every value here decides whether the service survives contact with a 512 MB
#   instance. The current constrained-image measurements are in
#   audit-output/2026-09-30-f5/.
#   Set by hand in a web form they are undocumented, unreviewable and lost the
#   next time the service is recreated. Here they are diffable.
#
# APPLY IT
#   Render dashboard -> Blueprints -> New Blueprint Instance -> pick this repo.
#   Render reads `render.yaml` from the repository ROOT by default, so this file
#   is symlinked/copied there, or you point the Blueprint at `infra/render.yaml`.
#
# THE NAME DOES NOT FIX THE URL — VERIFIED THE HARD WAY
#   `onrender.com` subdomains are globally unique, so a taken name gets a random
#   suffix. This service is named `pharmaguard-api` and answers on
#   https://pharmaguard-api-baml.onrender.com. The suffix is assigned at
#   creation, so deleting and recreating the service can change it.
#
#   That URL is compiled into the Flutter bundle as API_BASE_URL, so read it
#   back from the API after creating the service rather than predicting it.
#   Renaming or recreating silently breaks every already-built client.
#
# Verified against https://render.com/docs/blueprint-spec on 2026-08-13.

services:
  - type: web
    name: pharmaguard-api
    runtime: docker

    # Build context is the repo ROOT, not infra/ — the Dockerfile copies
    # backend/ and rag-corpus/, which are siblings of this directory.
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .

    plan: free
    region: oregon

    # /health is deliberately trivial: no PharmCAT, no disk, no subprocess.
    # Pointing the health check at /ready instead would make a waking container
    # look unhealthy and get it killed mid-start, because /ready resolves the
    # PharmCAT invoker. Use /ready by hand when you want to know whether an
    # analysis would actually succeed.
    healthCheckPath: /health

    # Render injects $PORT; the image's CMD reads ${PORT:-7860}. Do not add a
    # PORT env var here — setting it by hand is how you end up binding one port
    # and being health-checked on another.

    envVars:
      # ------------------------------------------------------------------ #
      # MEASURED. Do not tune these by feel.
      # ------------------------------------------------------------------ #

      # The JVM sizes its default max heap from the HOST's RAM, not the
      # cgroup's — measured at 727 MB of heap on a 16 GB machine, which is
      # instant death on a 512 MB instance. Stating -Xmx removes the guess.
      #
      # 208m/68m completed real-sized analyses under the 512 MiB cgroup.
      # At ten simultaneous analyses, six completed and four received bounded
      # SERVER_BUSY responses; final-image peak was 496.13 MiB with no
      # limit-hit/OOM event. One analysis plus nine coverage previews peaked
      # at 454.58 MiB with all ten requests completing.
      # 192m/64m failed the real-sized PharmCAT run; 224m/72m reached the
      # cgroup ceiling in the same burst. See audit-output/2026-09-30-f5/.
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx208m -XX:MaxMetaspaceSize=68m"

      # THE ONE THAT PREVENTS AN OOM KILL.
      #
      # Keep one JVM. The shared /analyze and /coverage admission gate also
      # serializes upload parsing/decompression before the JVM slot, so queued
      # requests do not retain multiple expanded VCFs in the 512 MiB cgroup.
      - key: MAX_CONCURRENT_PHARMCAT
        value: "1"

      # How long a queued request waits before being told the server is busy.
      # Bounded on purpose: an unbounded wait is indistinguishable from a hang.
      #
      # WAS 25, WHICH WAS WRONG ON THIS HOST. That value came from local
      # measurement, where an analysis takes ~2.6 s. Render's free CPU is
      # ~20x slower: measured p50 51.5 s, p95 54.5 s over 20 runs. A queued
      # request therefore timed out at 25 s having never had a chance — three
      # concurrent requests produced 503, 503, 200 with both failures landing
      # at exactly 25.4 s.
      #
      # 90 s bounds the wait before reading either queued upload body. It is a
      # time bound, not a fixed queue-length limit: fast local runs can admit
      # more than one waiter during that interval.
      # Raise it only alongside the client's receiveTimeout, which must exceed
      # queue wait + its own analysis.
      - key: PHARMCAT_QUEUE_TIMEOUT_SECONDS
        value: "90"

      # ------------------------------------------------------------------ #
      # Wiring
      # ------------------------------------------------------------------ #

      # The Pages origin, fixed in advance so this can be set before the
      # frontend exists. An empty value here makes the app REFUSE TO START on a
      # hosted instance — deliberately, because a wrong or missing origin
      # passes every health check while blocking every browser request.
      #
      # No trailing slash, and https — a browser origin has neither a path nor
      # a scheme mismatch to spare.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://pharmaguard-web.pages.dev"

      # Pre-generated, approval-checked explanations. No outbound call or API
      # key. Runtime clinical prose remains disabled even if `live` is selected;
      # the public/default release is explicitly static.
      - key: EXPLANATION_MODE
        value: static

      # Refuse to start if PharmCAT cannot be invoked, rather than starting
      # healthy and returning 503 to the first real visitor. On a demo service
      # a failed deploy is far cheaper than a silently broken one.
      - key: STRICT_PHARMCAT
        value: "1"

    # NO API KEY OF ANY KIND IS SET HERE, and none is needed. `assert_no_baked_secrets`
    # runs at startup and warns if one appears. The deployed path calls no LLM;
    # requirements-llm.txt is not installed in the image.
