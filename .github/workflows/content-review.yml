# Explanation content review — red BY DECISION until a person adjudicates.
#
# WHY THIS IS ITS OWN WORKFLOW (Phase 9 F-08)
#   The content gate used to be the last step of test.yml's backend job. It
#   exits non-zero while review is incomplete, which is the honest state, so the
#   `test` workflow was red on every push whether or not anything had regressed,
#   and every step after it was skipped. A red that is always there cannot tell
#   anyone that something broke.
#
#   Here it is its own lane. `test` now means the tests. This workflow's red
#   means exactly one thing: content review is incomplete. It turns green when a
#   person has decided every escalated sentence — not before, and never by
#   lowering the bar here.
#
# WHAT IT DOES NOT DECIDE
#   Releases. deploy-web.yml runs `release_status.py --run-required`, which may
#   ship a build that serves none of the stored prose (release policy
#   `withhold_unapproved_stored_prose`). This workflow reports the review; it
#   does not gate a deploy.
#
# Same setup the gate had inside test.yml — dependencies, the spaCy model, JDK
# 17 and the pinned binaries — so its result means what it meant there. No
# secrets, no API key, read-only.

name: content review

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-review:
    name: explanation content review (red until adjudicated)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          python -m spacy download en_core_web_sm

      - name: Assert no API key is present
        run: |
          if [ -n "${GEMINI_API_KEY:-}" ] || [ -n "${GOOGLE_API_KEY:-}" ]; then
            echo "::error::An API key is set in CI. The deployed path needs none."
            exit 1
          fi
          echo "No API key present — as required."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch and verify pinned binaries
        run: python scripts/fetch_pinned_artifacts.py

      # Detail reports. adjudication_status.py exits 1 BY DESIGN while sentences
      # await a person, and a Python crash also exits 1, so the exit code alone
      # cannot tell "incomplete" from "broken". This used to be `|| true`, which
      # accepted both. Instead the code is printed, and each run must have
      # produced its JSON report: a crash leaves none and fails the step.
      - name: Explanation review detail
        if: always()
        run: |
          for script in adjudication_status review_status; do
            set +e
            python "scripts/${script}.py" --json > "${script}.json"
            code=$?
            set -e
            if ! python -c "import json, sys; json.load(open(sys.argv[1]))" "${script}.json"; then
              echo "::error::${script}.py exited ${code} without a JSON report: a crash, not a review state"
              exit 1
            fi
            echo "${script}.py exited ${code}; report produced"
            cat "${script}.json"
          done

      - name: Authoritative explanation-content gate
        run: python scripts/release_status.py --content-only
