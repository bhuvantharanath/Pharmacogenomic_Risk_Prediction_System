# ===========================================================================
# PharmaGuard — CPIC recommendation -> risk label mapping
#
# ###########################################################################
# #  THIS MAPPING REQUIRES REVIEW AND SIGN-OFF BY THE FACULTY GUIDE BEFORE   #
# #  ANY CLINICAL CLAIM IS MADE ON THE BASIS OF ITS OUTPUT.                  #
# #                                                                          #
# #  It is an interpretation layer written by student software, not by CPIC. #
# #  CPIC publishes recommendations, not risk labels. Collapsing a paragraph #
# #  of guidance into one of five words is a lossy editorial act, and the    #
# #  rules below are where that act happens. Everything else in the backend  #
# #  passes PharmCAT's text through untouched.                               #
# ###########################################################################
#
# HOW THIS FILE IS USED
#   `cpic_engine.py` walks `risk_label_rules` in order and takes the FIRST
#   rule whose conditions all match. Order is therefore significant: the most
#   serious interpretations are checked first, so that a recommendation which
#   both "avoids" a drug and "considers an alternative" lands on Toxic rather
#   than Adjust Dosage.
#
# WHAT IT MATCHES ON
#   PharmCAT's CPIC annotation gives us, per (gene, phenotype, drug):
#     drug_recommendation      free text, e.g. "Avoid clopidogrel if possible..."
#     implications             free text, e.g. "...increased risk for adverse..."
#     classification           Strong | Moderate | Optional | Unspecified
#     alternate_drug_available bool
#     dosing_information       bool
#     other_prescribing_guidance bool
#   Matching is case-insensitive substring matching over the joined text of
#   `drug_recommendation` + `implications`, plus optional boolean flag checks.
#
# KNOWN LIMITATION — read before trusting `Ineffective` vs `Toxic`
#   Both labels can be implied by the same phrase ("avoid X"). We disambiguate
#   on the *reason* words in the implications (efficacy vs toxicity). Where the
#   text supports both, Toxic wins, because under-treating is usually more
#   recoverable than poisoning. That is a judgement call, not a CPIC position.
# ===========================================================================

version: 2
source_of_clinical_text: "PharmCAT CPIC Guideline Annotation (verbatim)"

# Collapsing a CPIC paragraph into one of five risk words is an editorial act,
# and not one a tool should own unsupervised. The rules below are written as
# reviewable data, each with a rationale, precisely so a qualified reader could
# check them.
#
# No such reader exists on this project. The old flag here said
# `requires_faculty_review: true`, which described a review as outstanding when
# it was never obtainable -- the same overstatement corrected everywhere else in
# this repo. The status is recorded plainly instead:
clinical_review_status: NOT_OBTAINED
clinical_review_note: >-
  No qualified clinical expert has reviewed these rules, and none is expected
  to. What IS checked: every rule matches on CPIC's own wording, the clinical
  text served to users is PharmCAT's verbatim output rather than anything
  derived here, and scripts/verify_provenance.py verifies that no explanation
  asserts a clinical claim absent from that source. That bounds what this
  mapping can get wrong -- it cannot invent a recommendation -- but it does not
  establish that collapsing a given paragraph to a given label is correct.

# ---------------------------------------------------------------------------
# Phenotype normalisation: PharmCAT's wording -> our contract enum.
#
# Metabolising enzymes use "... Metabolizer"; transporters (SLCO1B1) use
# "... Function". Both map onto the same PM/IM/NM/RM/URM scale. "Likely X" is
# PharmCAT hedging on an inferred call; we keep the phenotype but the call
# status separately lowers confidence, so we do not also downgrade here.
# ---------------------------------------------------------------------------
phenotype_map:
  "poor metabolizer": PM
  "likely poor metabolizer": PM
  "poor function": PM
  "intermediate metabolizer": IM
  "likely intermediate metabolizer": IM
  "decreased function": IM
  "possible intermediate metabolizer": IM
  # A TENTATIVE call is still a call. This entry closes a table gap found by the
  # label/prose cross-check: SLCO1B1 "Possible Decreased Function" was the only
  # phenotype string PharmCAT emits for our genes that had no mapping, so it fell
  # through to Unknown. The consequence was a red `Toxic` badge (correctly derived
  # from CPIC's text) sitting above prose reading "your genetic result was not
  # available for this gene" — which was false: the result WAS obtained, it is
  # simply less certain.
  #
  # Mapped to IM for the same reason "decreased function" and "possible
  # intermediate metabolizer" both are: the tentative prefix qualifies confidence,
  # not the functional class. Under-reporting a real call is the mirror image of
  # the over-claiming the CYP2D6 negative control exists to prevent — both
  # misstate what we know.
  #
  # Confidence is expressed where it belongs: `derive_severity` escalates only
  # for the extreme phenotypes (PM/URM), so a tentative IM lands at `high` while a
  # confident Poor Function lands at `critical`. The distinction survives without
  # a new enum value.
  "possible decreased function": IM
  "normal metabolizer": NM
  "normal function": NM
  "rapid metabolizer": RM
  "increased function": RM
  "ultrarapid metabolizer": URM
  "possible ultrarapid metabolizer": URM
  # Explicit sentinels: PharmCAT says it does not know.
  "no result": Unknown
  "indeterminate": Unknown
  "unknown": Unknown

# ---------------------------------------------------------------------------
# Risk label rules — evaluated top to bottom, first match wins.
#
# `any_text` matches if ANY listed phrase appears in the combined
# recommendation + implications text. `all_flags` requires each named boolean
# to equal the given value. A rule with neither is a catch-all.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# PRINCIPLE: match text that DIRECTS, never text that DESCRIBES
#
# Every defect the exhaustive CPIC validation found, and both over-broad patterns
# that had to be reverted while fixing them, share one shape: a rule matched
# prose that DESCRIBES dosing instead of prose that DIRECTS it. Write new rules
# against this axis.
#
#   DESCRIBES (must NOT trigger a dose-change or a directive label)
#     "30-80% of standard starting dose"   the phrase "standard starting dose"
#                                          appears, governed by a modifier — the
#                                          directive is the REDUCTION, not the
#                                          standard
#     "During therapy, adjust doses based on disease-specific guidelines"
#                                          generic downstream advice attached to
#                                          rows CPIC labels standard dosing
#     "takes at least 2 weeks to reach steady state after each dose adjustment"
#                                          pharmacokinetics, not an instruction
#     implications prose generally         explains biology; may mention dose,
#                                          risk or monitoring even where CPIC
#                                          gives NO directive at all
#
#   DIRECTS (may set the label)
#     "Initiate therapy with reduced starting doses"   modifier before dose
#     "Reduce starting dose by 50%"                    imperative + quantity
#     "Avoid clopidogrel if possible"                  imperative
#     "Prescribe an alternative statin"                imperative + substitution
#
# Two practical consequences, both already load-bearing in the rules below:
#
#   1. Specificity must win. A modifier-governed phrase has to be claimed by a
#      more specific rule BEFORE a rule keyed on the bare phrase can see it.
#      That is why `modified_dose_instruction` precedes `standard_dosing`.
#
#   2. Establishing whether a directive EXISTS must read the recommendation
#      field alone (`match_field: recommendation`). Implications describe; they
#      do not direct. Reading them to answer "is there guidance here?" is what
#      labelled two "No recommendation" rows as Adjust Dosage.
#
# The failure mode is subtle because descriptive text is *about* the right topic
# and shares the right vocabulary. Substring matching cannot separate the two;
# only seeing the grammatical relationship can, which is why several rules here
# use `any_text_regex` rather than a phrase list.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# POLICY: Toxic vs Ineffective
#
# Both mean "do not use this drug as-is", so the split needs one rule applied
# uniformly rather than ten case-by-case calls. The exhaustive CPIC validation
# (reports/validation_report.md) surfaced 11 rows where the two labels were in
# contention; this is the policy that resolves all of them.
#
#   TOXIC        CPIC's stated concern is HARM ARISING FROM EXPOSURE — the drug
#                or its metabolite accumulates and damages the patient.
#                e.g. simvastatin + decreased SLCO1B1 function: increased
#                simvastatin acid exposure -> myopathy.
#
#   INEFFECTIVE  CPIC's stated concern is THERAPEUTIC FAILURE — the drug does not
#                produce its intended effect. This holds EVEN WHEN the failure
#                has dangerous consequences.
#                e.g. clopidogrel + CYP2C19 PM: reduced active metabolite ->
#                higher platelet reactivity -> cardiovascular events. The events
#                are caused by the ABSENCE of antiplatelet effect, not by the
#                drug harming the patient.
#                e.g. codeine + CYP2D6 PM: reduced morphine formation ->
#                diminished analgesia.
#
# The distinguishing question is therefore NOT "does the text mention harm?" —
# both classes mention harm. It is "does the harm come from the drug acting, or
# from the drug failing to act?"
#
# This mattered: a first pass at the independent expectation table classified all
# ten clopidogrel rows as Toxic purely because their implications contain the
# word "adverse". That is the wrong reading, and the policy above is what
# corrects it. Prodrug failure is the commonest shape in this domain, so getting
# it wrong would have mislabelled a whole drug.
# ---------------------------------------------------------------------------

risk_label_rules:

  # Ordering note: every rule below was checked against real PharmCAT 3.4.0
  # output for the genotypes in test-data/. The order is not cosmetic — see
  # tests/test_label_mapping.py, which pins the outcome of each real text.

  - id: no_cpic_guidance
    label: Unknown
    # Rationale: CPIC declined to make a recommendation, so neither may we.
    #
    # MUST BE FIRST. This is the mapping-layer equivalent of the provenance rule
    # the explanation layer has always enforced: never assert clinical content
    # absent from the source. That promise was enforced on generated prose while
    # this layer sat unguarded, and the exhaustive CPIC validation found the gap —
    # two clopidogrel rows whose recommendation text is literally
    # "No recommendation" were being labelled **Adjust Dosage**, because the
    # *implications* prose mentioned monitoring. The label was ours, not CPIC's.
    #
    # Matching the recommendation field alone is deliberate. Implications describe
    # biology and may discuss dose or risk even when CPIC has no directive; only
    # the recommendation field carries the directive, so only it may establish
    # that one exists.
    any_text_regex:
      - '^\s*no\s+recommendation\s*\.?\s*$'
      - '^\s*(?:not\s+applicable|n/?a)\s*\.?\s*$'
    match_field: recommendation
    severity_hint: none

  - id: contraindicated
    label: Toxic
    # Rationale: the strongest wording CPIC uses — an outright prohibition.
    # Note "contraindicated" does NOT substring-match "contraindication", which
    # appears in permissive text like "...if no contraindication".
    any_text:
      - "contraindicated"
      - "should not be used"
      - "not recommended in"
    severity_hint: critical

  - id: avoid_for_lack_of_efficacy
    label: Ineffective
    # Rationale: avoidance justified by the drug not working, rather than by
    # harm — the prodrug-not-activated case (clopidogrel in a CYP2C19 PM).
    #
    # Checked BEFORE the toxicity rule on purpose. CPIC's clopidogrel PM text
    # cites "increased risk for adverse cardiac events", which is the downstream
    # consequence of therapeutic failure, not drug toxicity. Toxicity-first
    # ordering mislabels that flagship case as Toxic.
    #
    # The phrases are deliberately specific to *mechanism of failure*. Generic
    # wording like "significantly reduced" was removed: it also appears in DPYD
    # toxicity text ("significantly reduced DPD activity"), where it would be
    # exactly wrong.
    any_text:
      - "active metabolite formation"
      - "on-treatment platelet reactivity"
      - "reduced efficacy"
      - "lack of efficacy"
      - "loss of efficacy"
      - "therapeutic failure"
      - "decreased response"
      - "reduced response"
    # The efficacy phrases alone are not enough: CPIC uses the same vocabulary
    # to say a patient is NORMAL ("Increased clopidogrel active metabolite
    # formation ... use at standard dose"). An avoid/alternative instruction
    # must also be present for this to be a negative finding.
    require_any_text:
      - "avoid"
      - "alternative"
      - "select another"
    severity_hint: high

  - id: avoid_for_toxicity
    label: Toxic
    # Rationale: an avoidance instruction justified by harm. Verified against
    # DPYD PM ("Avoid use of 5-fluorouracil..." / "fatal drug toxicity") and
    # TPMT PM ("Consider alternative nonthiopurine..." / "myelosuppression").
    any_text:
      - "toxicity"
      - "myelosuppression"
      - "leukopenia"
      - "neutropenia"
      - "life-threatening"
      - "respiratory depression"
      - "overdose"
      - "fatal"
    # "alternative" is required here because CPIC also names toxicity in purely
    # reassuring text ("normal risk for fluoropyrimidine toxicity").
    require_any_text:
      - "avoid"
      - "alternative"
      - "discontinue"
      - "select another"
    severity_hint: high

  - id: prescribe_alternative_drug
    label: Toxic
    # Rationale: CPIC directing a DIFFERENT drug is the strongest signal short of
    # an outright contraindication, and it must not fall through to Unknown.
    #
    # Found by the exhaustive CPIC validation: three simvastatin rows read
    # "Prescribe an alternative statin depending on the desired potency" with
    # implications "increased risk of myopathy", and reached
    # `fallback_unmatched` -> Unknown. The avoid/contraindicated rules look for
    # "avoid" and "alternative therapy"; none matched "prescribe an alternative
    # <drug class>". Returning Unknown there silently DROPS a toxicity warning,
    # which is worse than a conservative label — Unknown reads as "no
    # information", not "use something else".
    #
    # Labelled Toxic rather than Ineffective per the documented policy below:
    # CPIC's stated concern here is harm from exposure (myopathy), not
    # therapeutic failure.
    any_text_regex:
      - '\b(?:prescribe|use|select|choose|consider)\s+(?:an?\s+)?alternat\w+'
      - '\balternat\w+\s+(?:statin|agent|drug|therapy|medication)\b'
    severity_hint: high

  - id: avoid_for_therapeutic_failure
    label: Ineffective
    # Rationale: applies the Toxic-vs-Ineffective policy above. CPIC's codeine
    # PM text says to avoid the drug because it does not WORK ("greatly reduced
    # morphine formation leading to diminished analgesia"), not because it harms.
    # It previously reached `avoid_unqualified`, whose Toxic default mislabelled
    # therapeutic failure as poisoning.
    require_any_text:
      - "avoid"
      - "alternative"
    any_text_regex:
      - '\bdiminish\w*\s+(?:\w+\s+){0,2}?analgesi'
      - '\breduced\s+(?:\w+\s+){0,3}?(?:morphine|active\s+metabolite)\s+formation'
      - '\b(?:lack|loss)\s+of\s+(?:efficacy|effect|analgesia)\b'
    severity_hint: high

  - id: avoid_unqualified
    label: Toxic
    # Rationale: an avoidance instruction with no reason our phrase lists
    # recognise. Defaulting to Toxic keeps the failure conservative; the card
    # still shows CPIC's own words, so the label is not the reader's only cue.
    any_text:
      - "avoid"
    severity_hint: high

  - id: modified_dose_instruction
    label: Adjust Dosage
    # Rationale: a dose instruction GOVERNED BY A MODIFIER is a dose change, and
    # must be recognised before any unmodified-standard-dosing rule can claim it.
    #
    # This rule exists because of a real, clinically consequential defect found
    # by the exhaustive CPIC validation (reports/validation_report.md). CPIC's
    # azathioprine text reads:
    #
    #   "Initiate therapy with REDUCED starting doses (30-80% of standard
    #    starting dose) if standard starting dose is >=2 mg/kg/day."
    #
    # `standard_dosing` matched the substring "standard starting dose" occurring
    # inside "30-80% of standard starting dose" and returned Safe — telling a
    # patient who needs a 30-80% dose reduction that normal dosing is fine. It
    # affected 16 of the 35 azathioprine recommendation rows.
    #
    # The fix is deliberately GENERAL, not a patch for azathioprine. No pattern
    # here names a drug, a gene, or a specific percentage: the bug is the class
    # "modifier-governed phrase matched by an unmodified-phrase rule", and a
    # targeted fix would have left that class live for every other drug whose
    # CPIC text says "...% of standard dose". Ordering it above `standard_dosing`
    # is what makes specificity win, which is the same discipline the rest of
    # this file already relies on.
    #
    # Regex rather than substrings because the distinction is structural: the
    # modifier has to be seen governing the dose phrase. See
    # cpic_engine._rule_matches.
    any_text_regex:
      # "30-80% of standard dose", "20%-50% of the normal starting dose"
      - '\d+\s*%?\s*(?:-|–|to)?\s*\d*\s*%\s*of\s+(?:the\s+)?(?:standard|normal|usual|label)'
      # "reduced starting doses", "reduce the starting dose"
      - '\breduc\w*\s+(?:the\s+)?(?:\w+\s+){0,2}?(?:starting\s+)?dos'
      # "increased dose", "increase the starting dose"
      - '\bincreas\w*\s+(?:the\s+)?(?:\w+\s+){0,2}?(?:starting\s+)?dos'
      # "adjusted dose" / "dose adjustment" as an instruction
      # NOTE: the NOUN forms ("dose reduction", "dose adjustment") are
      # deliberately absent. They are ambiguous between instruction and
      # background: CPIC's normal-metaboliser rows contain "it usually takes at
      # least 2 weeks to reach steady state after each dose adjustment", which is
      # pharmacokinetics, not a direction to change the dose. Including them cost
      # 5 regressions. Only MODIFIER-BEFORE-DOSE ("reduced starting dose") and
      # percentage-of-standard are unambiguous, and only those need to pre-empt
      # `standard_dosing`. Genuine noun-form instructions are still caught by
      # `dose_change_or_monitoring` below.
      # NOT a bare "adjust ... dose" pattern. That was tried and reverted: it
      # matched CPIC's generic downstream advice "During therapy, adjust doses
      # based on disease-specific guidelines", which appears in normal-metaboliser
      # rows that CPIC explicitly labels standard dosing — 7 regressions in the
      # exhaustive run. Genuine "adjust" instructions are still caught by
      # `dose_change_or_monitoring` further down; they do not need to pre-empt
      # `standard_dosing`, because only a MODIFIED dose does.
    severity_hint: none

  - id: standard_dosing
    label: Safe
    # Rationale: CPIC explicitly says to prescribe normally.
    #
    # Checked BEFORE the dose-change rule because CPIC's "normal" text routinely
    # contains generic prescribing advice — "Initiate therapy with standard
    # starting dose ... During therapy, adjust doses based on disease-specific
    # guidelines" (azathioprine NM) would otherwise match "adjust" and be
    # mislabelled Adjust Dosage.
    #
    # Safe only because all avoid/toxicity/efficacy rules above have already
    # failed. Order is load-bearing: CPIC's clopidogrel PM text also contains
    # "at standard dose" (referring to the *alternative* drug), and reaching
    # this rule with that text would be a serious mislabel.
    any_text:
      - "standard dose"
      - "standard dosing"
      - "standard starting dose"
      - "normal starting dose"
      - "label-recommended dosage"
      - "label recommended dosage"
      - "prescribe desired starting dose"
      - "no indication to change dose"
      - "no reason to selectively adjust"
      - "usual dose"
    severity_hint: none

  - id: dose_change_or_monitoring
    label: Adjust Dosage
    # Rationale: the drug stays, the plan changes — dose reduction, increase,
    # titration, or extra monitoring. Verified against DPYD IM ("Reduce starting
    # dose by 50% followed by titration...").
    any_text:
      - "reduce"
      - "dose reduction"
      - "reduced starting dose"
      - "increase the dose"
      - "titrate"
      - "titration"
      - "lower dose"
      - "higher dose"
      - "lower starting dose"
      - "monitor"
      - "alternate dosing"
      - "adjust"
    severity_hint: moderate

  - id: dosing_information_flag
    label: Adjust Dosage
    # Rationale: PharmCAT's own structured flag says this row carries dosing
    # information, even where our phrase list missed the wording. Catching it
    # here beats falling through to Unknown.
    all_flags:
      dosing_information: true
    severity_hint: moderate

  - id: alternate_drug_flag
    label: Adjust Dosage
    # Rationale: an alternative exists but no avoid-instruction and no stated
    # harm matched. Treat as a prescribing change, not a prohibition.
    all_flags:
      alternate_drug_available: true
    severity_hint: moderate

  - id: fallback_unmatched
    label: Unknown
    # Rationale: PharmCAT gave an annotation whose wording none of the above
    # recognises. Returning Unknown rather than guessing Safe means a gap in
    # this table surfaces as a visible "we do not know" instead of a silent
    # false reassurance. Grep logs for this id when extending the table.
    severity_hint: none

# ---------------------------------------------------------------------------
# Severity — deterministic function of (risk_label, phenotype).
#
# Base severity comes from the label. It is escalated one step when the
# phenotype is at an extreme (PM/URM), because the same recommendation carries
# more consequence for a patient at the end of the activity range than for one
# just outside normal.
#
# `severity_hint` on a matched rule overrides the base, but escalation still
# applies on top.
# ---------------------------------------------------------------------------
severity:
  base_by_label:
    Safe: none
    "Adjust Dosage": moderate
    Toxic: high
    Ineffective: high
    Unknown: none
  # Ordered scale used for escalation.
  scale: [none, low, moderate, high, critical]
  escalate_one_step_for_phenotypes: [PM, URM]
  # Never escalate these labels: "Safe" plus a PM phenotype is still safe, and
  # escalating Unknown would imply knowledge we do not have.
  never_escalate_labels: [Safe, Unknown]

# ---------------------------------------------------------------------------
# Confidence score.
#
# !! THIS IS NOT AN ML CONFIDENCE AND NOT A PROBABILITY. !!
# It is a fixed lookup on how good the underlying *call* was. It says nothing
# about whether the clinical recommendation is correct — only about how sure
# PharmCAT was that it read the genotype properly. The numbers are arbitrary
# but ordered, chosen so the UI can render a meaningful bar.
# ---------------------------------------------------------------------------
confidence:
  by_call_status:
    # Exactly one diplotype matched, all required positions present.
    definite: 0.95
    # Several diplotypes fit equally well; we report the first.
    ambiguous: 0.60
    # Matcher ran but could not call — usually missing positions.
    no_call: 0.20
    # PharmCAT did not attempt the gene (CYP2D6 from a plain VCF).
    not_attempted: 0.10
  # Applied when the gene was called but no CPIC annotation matched the
  # phenotype, so the label is Unknown regardless of call quality.
  no_guidance: 0.10
  # Drug is not in any CPIC guideline PharmCAT knows about.
  unknown_drug: 0.0

# ---------------------------------------------------------------------------
# Phenotype abnormality rank.
#
# Used only to decide WHICH GENE to report when a CPIC guideline keys off more
# than one (azathioprine keys off both TPMT and NUDT15). We report the most
# abnormal called gene, because that is the one driving the recommendation.
# Picking arbitrarily would report "NUDT15 Normal Metabolizer" for a TPMT poor
# metaboliser — hiding the actual finding and under-stating severity.
# ---------------------------------------------------------------------------
phenotype_abnormality_rank:
  PM: 3
  URM: 3
  IM: 2
  RM: 2
  NM: 1
  Unknown: 0

# ---------------------------------------------------------------------------
# Drug -> primary gene, used to pick which gene call to attach to a drug when
# the CPIC annotation's lookup key does not name one (rare). PharmCAT's
# annotation lookup_key is authoritative; this is only a fallback.
# ---------------------------------------------------------------------------
drug_primary_gene:
  clopidogrel: CYP2C19
  warfarin: CYP2C9
  simvastatin: SLCO1B1
  azathioprine: TPMT
  mercaptopurine: TPMT
  thioguanine: TPMT
  fluorouracil: DPYD
  capecitabine: DPYD
  codeine: CYP2D6
  tramadol: CYP2D6
